name: Publish

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: 'crates.io API token. If not passed, crates.io trusted publishing is used, and the calling job must grant `id-token: write`.'
        required: false
    inputs:
      additional-deb-packages:
        description: 'Space separated list of .deb packages that will be installed on ubuntu.'
        required: false
        default: ''
        type: string

jobs:

  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
    - name: Install additional dependencies (Linux)
      if: inputs.additional-deb-packages != ''
      run: sudo apt-get update && sudo apt-get -y install ${{ inputs.additional-deb-packages }}
    - uses: actions/checkout@v7
    - uses: stellar/actions/rust-cache@main
    - run: rustup update
    - uses: stellar/binaries@v86
      with:
        name: cargo-workspaces
        version: 0.2.35
    - id: token
      run: echo "use_token=${{ secrets.CARGO_REGISTRY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
    - name: Use crates.io trusted publishing (when no token)
      if: steps.token.outputs.use_token != 'true'
      id: auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
    - run: cargo workspaces publish --all --from-git --yes
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
