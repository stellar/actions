name: 'ECR Login via OIDC'
description: 'Configures AWS credentials via OIDC, assumes ECR push role, and logs into private and/or public ECR registries.'

inputs:
  login-public-ecr:
    description: 'Whether to also log into ECR Public (true/false)'
    required: false
    default: 'false'
  auth-mode:
    description: >-
      Deprecated; 'oidc' is the only mode. The action assumes github-actions-ecr directly with the GitHub OIDC
      token, and access is scoped by matching the token's sub claim to each ECR repository's Repository tag.
      'chain' is no longer supported and is treated as 'oidc' with a warning.
    required: false
    default: 'oidc'
  scan-images:
    description: >-
      Whether ecr-push scans each image with Amazon Inspector before pushing it and warns about the
      critical CVEs ECR enhanced scanning would report (true/false). The scan never fails the push.
    required: false
    default: 'true'
  scan-only:
    description: >-
      For Copilot coding agent setup steps (true/false). Logs in to a role that can only scan images,
      not push them, installs ecr-scan instead of ecr-push, and saves the credentials to ~/.aws so the
      agent can run ecr-scan in its session. Skips ECR login.
    required: false
    default: 'false'

outputs:
  ecr-registry:
    description: 'The private ECR registry URI'
    value: ${{ steps.login-ecr.outputs.registry }}
  ecr-public-registry:
    description: 'The public ECR registry URI (only set when login-public-ecr is true)'
    value: ${{ steps.login-ecr-public.outputs.registry }}

runs:
  using: 'composite'
  steps:
    - name: Validate auth-mode
      shell: bash
      env:
        AUTH_MODE: ${{ inputs.auth-mode }}
      run: |
        case "$AUTH_MODE" in
          oidc) ;;
          chain) echo "::warning::auth-mode 'chain' has been removed; using 'oidc'. Drop the auth-mode input." ;;
          *) echo "::error::auth-mode must be 'oidc', got '${AUTH_MODE}'"; exit 1 ;;
        esac

    # Single role assumed with the GitHub OIDC token; no session tags.
    - name: Configure AWS credentials via OIDC (sub-scoped role)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.scan-only == 'true' && 'arn:aws:iam::746476062914:role/github-actions-inspector-scan' || 'arn:aws:iam::746476062914:role/github-actions-ecr' }}
        aws-region: "us-east-1"
        role-session-name: gha-ecr-${{ github.run_id }}-${{ github.run_attempt }}

    # Step 3: Login to private ECR
    - name: Login to Amazon ECR
      id: login-ecr
      if: inputs.scan-only != 'true'
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    # Step 4: Conditionally login to public ECR
    - name: Login to Amazon ECR Public
      if: inputs.login-public-ecr == 'true' && inputs.scan-only != 'true'
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registry-type: public

    - name: Install inspector-sbomgen
      if: inputs.scan-images == 'true' || inputs.scan-only == 'true'
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64 | arm64) arch=arm64 ;; *) arch= ;; esac
        dir="${RUNNER_TEMP}/inspector-sbomgen"
        mkdir -p "$dir"
        if [ -n "$arch" ] \
          && curl -fsSL --retry 3 "https://amazon-inspector-sbomgen.s3.amazonaws.com/latest/linux/${arch}/inspector-sbomgen.zip" -o "$dir/sbomgen.zip" \
          && unzip -q -o -j "$dir/sbomgen.zip" '*/inspector-sbomgen' -d "$dir"; then
          chmod +x "$dir/inspector-sbomgen"
          echo "ECR_SCAN_SBOMGEN=$dir/inspector-sbomgen" >> "$GITHUB_ENV"
        else
          echo "::warning::Could not install inspector-sbomgen; images won't be scanned."
        fi

    # Install ecr-push wrapper script onto PATH
    - name: Install ecr-push helper
      if: inputs.scan-only != 'true'
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
        AWS_REGION_INPUT: "us-east-1"
        GITHUB_REPO: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Repos with immutable OIDC subjects send "owner@id/repo@id" instead of "owner/repo", so tag with what the token carries.
        oidc_sub() {
          local payload
          payload=$(curl -sSf --retry 3 --retry-all-errors -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r .value | cut -d. -f2 | tr '_-' '/+') || return 1
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          printf '%s' "$payload" | base64 -d | jq -r '.sub // empty'
        }
        SUB=$(oidc_sub) || SUB=""
        REPO_TAG="${SUB#repo:}"
        REPO_TAG="${REPO_TAG%%:*}"
        if [ -z "$REPO_TAG" ]; then
          echo "::warning::Could not read the OIDC sub claim; tagging new ECR repositories with ${GITHUB_REPO}"
        fi

        SCRIPT_DIR="${RUNNER_TEMP}/ecr-push-bin"
        mkdir -p "$SCRIPT_DIR"
        cat > "$SCRIPT_DIR/ecr-push" << 'SCRIPT'
        #!/usr/bin/env bash
        set -euo pipefail

        if [ $# -ne 1 ]; then
          echo "Usage: ecr-push <image:tag>"
          exit 1
        fi

        IMAGE="$1"
        REGION="${ECR_PUSH_REGION}"
        REPO_TAG="${ECR_PUSH_REPO_TAG}"

        # Extract repo name from image URI: <account>.dkr.ecr.<region>.amazonaws.com/<repo-name>:<tag>
        REPO_NAME=$(echo "$IMAGE" | sed 's|^[^/]*/||; s|:[^:]*$||')

        # Check if repo exists, create if not
        if aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$REGION" 2>/dev/null; then
          echo "ECR repository '${REPO_NAME}' already exists"
          # Check if Repository tag exists, add it if missing
          EXISTING_TAGS=$(aws ecr list-tags-for-resource \
            --resource-arn "$(aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$REGION" --query 'repositories[0].repositoryArn' --output text)" \
            --region "$REGION" --query 'tags[?Key==`Repository`].Value' --output text 2>/dev/null || true)
          if [ -z "$EXISTING_TAGS" ]; then
            echo "Adding Repository tag to '${REPO_NAME}'"
            aws ecr tag-resource \
              --resource-arn "$(aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$REGION" --query 'repositories[0].repositoryArn' --output text)" \
              --region "$REGION" \
              --tags "Key=Repository,Value=${REPO_TAG}"
          fi
        elif [[ "$REPO_NAME" =~ ^(dev|stg|prd)/ ]]; then
          echo "Creating ECR repository '${REPO_NAME}' with Repository=${REPO_TAG}"
          aws ecr create-repository \
            --repository-name "$REPO_NAME" \
            --region "$REGION" \
            --tags "Key=Repository,Value=${REPO_TAG}"
        else
          echo "::warning::Repository '${REPO_NAME}' does not exist and is not under dev/, stg/, or prd/. Skipping creation — these repositories must be managed via Terraform."
        fi

        # Warn about the critical CVEs ECR enhanced scanning would report. The scan never fails the push.
        if [ -n "${ECR_SCAN_SBOMGEN:-}" ]; then
          ID=$(docker image inspect -f '{{.Id}}' "$IMAGE" 2>/dev/null || true)
          # Each image is scanned once per job, even when it's pushed to several repositories.
          if [ -n "$ID" ] && [ -e "${ECR_PUSH_SCANNED}/${ID#sha256:}" ]; then
            echo "Already scanned ${ID}"
          else
            SCAN_OUT=$(mktemp)
            SCAN_ERR=$(mktemp)
            STATUS=0
            "$(dirname "$0")/ecr-scan" "$IMAGE" >"$SCAN_OUT" 2>"$SCAN_ERR" || STATUS=$?
            if [ -s "$SCAN_ERR" ] && grep -q '^Not scanned' "$SCAN_ERR"; then
              echo "::warning title=Unscanned packages in ${REPO_NAME}::$(grep '^Not scanned' "$SCAN_ERR") (${IMAGE})"
            fi
            case "$STATUS" in
              0)
                echo "Amazon Inspector: no critical findings in ${IMAGE}"
                ;;
              1)
                sed '$d' "$SCAN_OUT" >"${SCAN_OUT}.cves"
                COUNT=$(wc -l <"${SCAN_OUT}.cves" | tr -d ' ')
                echo "::warning title=Critical CVEs in ${REPO_NAME}::${COUNT} critical CVE(s) in ${IMAGE}: $(paste -sd ';' "${SCAN_OUT}.cves" | sed 's/;/; /g')"
                {
                  echo "### ${COUNT} critical CVE(s) in \`${IMAGE}\`"
                  echo
                  sed 's/^/- /' "${SCAN_OUT}.cves"
                  echo
                } >>"$GITHUB_STEP_SUMMARY"
                ;;
              *)
                tail -5 "$SCAN_ERR" >&2
                echo "::warning::Amazon Inspector scan of ${IMAGE} failed; pushing without it."
                ;;
            esac
            if [ "$STATUS" -le 1 ] && [ -n "$ID" ]; then
              mkdir -p "$ECR_PUSH_SCANNED" && touch "${ECR_PUSH_SCANNED}/${ID#sha256:}"
            fi
            rm -f "$SCAN_OUT" "${SCAN_OUT}.cves" "$SCAN_ERR"
          fi
        fi

        echo "Attempting to push image to repository '${REPO_NAME}'"
        docker push "$IMAGE"
        SCRIPT
        chmod +x "$SCRIPT_DIR/ecr-push"
        cp "${ACTION_PATH}/ecr-scan" "$SCRIPT_DIR/ecr-scan"
        echo "$SCRIPT_DIR" >> "$GITHUB_PATH"
        echo "ECR_PUSH_REGION=${AWS_REGION_INPUT}" >> "$GITHUB_ENV"
        echo "ECR_PUSH_REPO_TAG=${REPO_TAG:-$GITHUB_REPO}" >> "$GITHUB_ENV"
        echo "ECR_PUSH_SCANNED=${RUNNER_TEMP}/ecr-push-scanned" >> "$GITHUB_ENV"

    # Copilot's session doesn't inherit this job's environment, so put the tools on the system PATH
    # and the credentials in the default AWS config files.
    - name: Install ecr-scan for Copilot
      if: inputs.scan-only == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -z "${ECR_SCAN_SBOMGEN:-}" ]; then
          echo "::error::inspector-sbomgen didn't install, so ecr-scan can't run."
          exit 1
        fi
        sudo install -m 755 "$ECR_SCAN_SBOMGEN" /usr/local/bin/inspector-sbomgen
        sudo install -m 755 "${ACTION_PATH}/ecr-scan" /usr/local/bin/ecr-scan
        mkdir -p ~/.aws
        umask 077
        cat >~/.aws/credentials <<CREDS
        [default]
        aws_access_key_id = ${AWS_ACCESS_KEY_ID}
        aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
        aws_session_token = ${AWS_SESSION_TOKEN}
        CREDS
        printf '[default]\nregion = us-east-1\n' >~/.aws/config
        echo "ecr-scan is installed; credentials for github-actions-inspector-scan are in ~/.aws."
