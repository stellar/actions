name: 'ECR Login via OIDC'
description: 'Configures AWS credentials via OIDC, assumes ECR push role, and logs into private and/or public ECR registries.'

inputs:
  login-public-ecr:
    description: 'Whether to also log into ECR Public (true/false)'
    required: false
    default: 'false'
  auth-mode:
    description: >-
      Deprecated; 'oidc' is the only mode. The action assumes github-actions-ecr directly with the GitHub OIDC
      token, and access is scoped by matching the token's sub claim to each ECR repository's Repository tag.
      'chain' is no longer supported and is treated as 'oidc' with a warning.
    required: false
    default: 'oidc'
  scan-images:
    description: >-
      Whether ecr-push scans each image with Amazon Inspector before pushing it and warns about the
      critical CVEs ECR enhanced scanning would report (true/false). The scan never fails the push.
    required: false
    default: 'true'

outputs:
  ecr-registry:
    description: 'The private ECR registry URI'
    value: ${{ steps.login-ecr.outputs.registry }}
  ecr-public-registry:
    description: 'The public ECR registry URI (only set when login-public-ecr is true)'
    value: ${{ steps.login-ecr-public.outputs.registry }}

runs:
  using: 'composite'
  steps:
    - name: Validate auth-mode
      shell: bash
      env:
        AUTH_MODE: ${{ inputs.auth-mode }}
      run: |
        case "$AUTH_MODE" in
          oidc) ;;
          chain) echo "::warning::auth-mode 'chain' has been removed; using 'oidc'. Drop the auth-mode input." ;;
          *) echo "::error::auth-mode must be 'oidc', got '${AUTH_MODE}'"; exit 1 ;;
        esac

    # Single role assumed with the GitHub OIDC token; no session tags.
    - name: Configure AWS credentials via OIDC (sub-scoped role)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: "arn:aws:iam::746476062914:role/github-actions-ecr"
        aws-region: "us-east-1"
        role-session-name: gha-ecr-${{ github.run_id }}-${{ github.run_attempt }}

    # Step 3: Login to private ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    # Step 4: Conditionally login to public ECR
    - name: Login to Amazon ECR Public
      if: inputs.login-public-ecr == 'true'
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registry-type: public

    - name: Install inspector-sbomgen
      if: inputs.scan-images == 'true'
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64 | arm64) arch=arm64 ;; *) arch= ;; esac
        dir="${RUNNER_TEMP}/inspector-sbomgen"
        mkdir -p "$dir"
        if [ -n "$arch" ] \
          && curl -fsSL --retry 3 "https://amazon-inspector-sbomgen.s3.amazonaws.com/latest/linux/${arch}/inspector-sbomgen.zip" -o "$dir/sbomgen.zip" \
          && unzip -q -o -j "$dir/sbomgen.zip" '*/inspector-sbomgen' -d "$dir"; then
          chmod +x "$dir/inspector-sbomgen"
          echo "ECR_PUSH_SBOMGEN=$dir/inspector-sbomgen" >> "$GITHUB_ENV"
        else
          echo "::warning::Could not install inspector-sbomgen; ecr-push will push without scanning."
        fi

    # Install ecr-push wrapper script onto PATH
    - name: Install ecr-push helper
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
        AWS_REGION_INPUT: "us-east-1"
        GITHUB_REPO: ${{ github.repository }}
      run: |
        # Repos with immutable OIDC subjects send "owner@id/repo@id" instead of "owner/repo", so tag with what the token carries.
        oidc_sub() {
          local payload
          payload=$(curl -sSf --retry 3 --retry-all-errors -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r .value | cut -d. -f2 | tr '_-' '/+') || return 1
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          printf '%s' "$payload" | base64 -d | jq -r '.sub // empty'
        }
        SUB=$(oidc_sub) || SUB=""
        REPO_TAG="${SUB#repo:}"
        REPO_TAG="${REPO_TAG%%:*}"
        if [ -z "$REPO_TAG" ]; then
          echo "::warning::Could not read the OIDC sub claim; tagging new ECR repositories with ${GITHUB_REPO}"
        fi

        SCRIPT_DIR="${RUNNER_TEMP}/ecr-push-bin"
        mkdir -p "$SCRIPT_DIR"
        cat > "$SCRIPT_DIR/ecr-push" << 'SCRIPT'
        #!/usr/bin/env bash
        set -euo pipefail

        if [ $# -ne 1 ]; then
          echo "Usage: ecr-push <image:tag>"
          exit 1
        fi

        IMAGE="$1"
        REGION="${ECR_PUSH_REGION}"
        REPO_TAG="${ECR_PUSH_REPO_TAG}"

        # Extract repo name from image URI: <account>.dkr.ecr.<region>.amazonaws.com/<repo-name>:<tag>
        REPO_NAME=$(echo "$IMAGE" | sed 's|^[^/]*/||; s|:[^:]*$||')

        # Check if repo exists, create if not
        if aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$REGION" 2>/dev/null; then
          echo "ECR repository '${REPO_NAME}' already exists"
          # Check if Repository tag exists, add it if missing
          EXISTING_TAGS=$(aws ecr list-tags-for-resource \
            --resource-arn "$(aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$REGION" --query 'repositories[0].repositoryArn' --output text)" \
            --region "$REGION" --query 'tags[?Key==`Repository`].Value' --output text 2>/dev/null || true)
          if [ -z "$EXISTING_TAGS" ]; then
            echo "Adding Repository tag to '${REPO_NAME}'"
            aws ecr tag-resource \
              --resource-arn "$(aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$REGION" --query 'repositories[0].repositoryArn' --output text)" \
              --region "$REGION" \
              --tags "Key=Repository,Value=${REPO_TAG}"
          fi
        elif [[ "$REPO_NAME" =~ ^(dev|stg|prd)/ ]]; then
          echo "Creating ECR repository '${REPO_NAME}' with Repository=${REPO_TAG}"
          aws ecr create-repository \
            --repository-name "$REPO_NAME" \
            --region "$REGION" \
            --tags "Key=Repository,Value=${REPO_TAG}"
        else
          echo "::warning::Repository '${REPO_NAME}' does not exist and is not under dev/, stg/, or prd/. Skipping creation — these repositories must be managed via Terraform."
        fi

        # Scans the SBOM's components [start, start + count) with its OS components, halving the batch
        # when Inspector rejects the response for having too many findings.
        scan_batch() {
          local work="$1" start="$2" count="$3" half
          jq --argjson start "$start" --argjson count "$count" '.components |= (
              [.[] | select(.type == "operating-system")]
              + ([.[] | select(.type != "operating-system")] | .[$start:$start + $count]))' \
            "$work/sbom.json" >"$work/part.json" || return 1
          if aws inspector-scan scan-sbom --region "$REGION" --sbom "file://$work/part.json" \
            --output-format CYCLONE_DX_1_5 --query sbom >"$work/scan-$start.json" 2>"$work/scan.err"; then
            return 0
          fi
          if ! grep -q 'Response too large' "$work/scan.err"; then
            cat "$work/scan.err" >&2
            return 1
          fi
          if [ "$count" -le 1 ]; then
            # One package with too many CVEs to return, such as Ubuntu's linux kernel package.
            rm -f "$work/scan-$start.json"
            jq -r '.components[] | select(.type != "operating-system") | "\(.name) \(.version)"' "$work/part.json" >>"$work/unscanned.txt"
            return 0
          fi
          half=$((count / 2))
          scan_batch "$work" "$start" "$half" && scan_batch "$work" $((start + half)) $((count - half))
        }

        # Warn about the critical CVEs ECR enhanced scanning would report for this image. Uses
        # Amazon Inspector's own rating and skips lockfile dev dependencies, as ECR does.
        # Runs as `scan "$work" || ...`, where set -e doesn't apply, so each step checks its own exit.
        scan() {
          local work="$1" id count
          id=$(docker image inspect -f '{{.Id}}' "$IMAGE") || return 1
          # Each image is scanned once per job, even when it's pushed to several repositories.
          if [ -e "${ECR_PUSH_SCANNED}/${id#sha256:}" ]; then
            echo "Already scanned ${id}"
            return 0
          fi
          if ! { docker save "$IMAGE" -o "$work/image.tar" \
            && "$ECR_PUSH_SBOMGEN" container --image "$work/image.tar" -o "$work/sbom.json" >"$work/sbomgen.log" 2>&1; }; then
            # docker save can't export some pulled multi-platform images, so scan the image's files instead.
            tail -3 "$work/sbomgen.log" 2>/dev/null
            echo "Scanning the files of ${IMAGE} instead of the saved image"
            rm -f "$work/image.tar"
            local container
            container=$(docker create "$IMAGE") || return 1
            mkdir "$work/rootfs"
            docker export "$container" | tar -x -C "$work/rootfs" 2>/dev/null
            docker rm "$container" >/dev/null
            "$ECR_PUSH_SBOMGEN" directory --path "$work/rootfs" -o "$work/sbom.json" >"$work/sbomgen.log" 2>&1 \
              || { tail -5 "$work/sbomgen.log" >&2; return 1; }
            rm -rf "$work/rootfs"
          fi
          rm -f "$work/image.tar"
          scan_batch "$work" 0 "$(jq '[.components[]? | select(.type != "operating-system")] | length' "$work/sbom.json")" \
            || return 1
          # Each response numbers its own bom-refs, so match CVEs to packages per batch, then combine.
          for part in "$work"/scan-*.json; do
            [ -e "$part" ] || continue
            jq -c '
              (.components // []) as $components
              | .vulnerabilities // []
              | .[]
              | select(any(.ratings[]?; .source.name == "AMAZON_INSPECTOR" and .severity == "critical"))
              | . as $v
              | {id: $v.id, packages: [$v.affects[]?.ref as $ref | $components[]
                  | select(."bom-ref" == $ref and ((.purl // "") | test("dev_dependency=true") | not))
                  | "\(.name) \(.version // "")" | rtrimstr(" ")]}
              | select(.packages | length > 0)
            ' "$part" || return 1
          done >"$work/critical.jsonl"
          jq -rs 'group_by(.id) | map("\(.[0].id): \(map(.packages[]) | unique | join(", "))")[]' \
            "$work/critical.jsonl" >"$work/critical.txt" || return 1
          mkdir -p "$ECR_PUSH_SCANNED" && touch "${ECR_PUSH_SCANNED}/${id#sha256:}"
          if [ -s "$work/unscanned.txt" ]; then
            echo "::warning title=Unscanned packages in ${REPO_NAME}::Amazon Inspector has too many CVEs to report for these packages in ${IMAGE}, so they weren't checked: $(paste -sd ';' "$work/unscanned.txt" | sed 's/;/; /g')"
          fi
          count=$(wc -l <"$work/critical.txt" | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "Amazon Inspector: no critical findings in ${IMAGE}"
            return 0
          fi
          echo "::warning title=Critical CVEs in ${REPO_NAME}::${count} critical CVE(s) in ${IMAGE}: $(paste -sd ';' "$work/critical.txt" | sed 's/;/; /g')"
          {
            echo "### ${count} critical CVE(s) in \`${IMAGE}\`"
            echo
            sed 's/^/- /' "$work/critical.txt"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
        }
        if [ -n "${ECR_PUSH_SBOMGEN:-}" ]; then
          SCAN_DIR=$(mktemp -d)
          scan "$SCAN_DIR" || echo "::warning::Amazon Inspector scan of ${IMAGE} failed; pushing without it."
          rm -rf "$SCAN_DIR"
        fi

        echo "Attempting to push image to repository '${REPO_NAME}'"
        docker push "$IMAGE"
        SCRIPT
        chmod +x "$SCRIPT_DIR/ecr-push"
        echo "$SCRIPT_DIR" >> "$GITHUB_PATH"
        echo "ECR_PUSH_REGION=${AWS_REGION_INPUT}" >> "$GITHUB_ENV"
        echo "ECR_PUSH_REPO_TAG=${REPO_TAG:-$GITHUB_REPO}" >> "$GITHUB_ENV"
        echo "ECR_PUSH_SCANNED=${RUNNER_TEMP}/ecr-push-scanned" >> "$GITHUB_ENV"
