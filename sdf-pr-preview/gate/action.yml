# Policy half of the PR preview flow. Withdraws the `preview` label, handles
# teardown on close, and decides whether this PR may have a preview. Emits
# `member` and `image-tag`; the caller then builds and pushes its own
# image(s) - guarded by `member` - and calls sdf-pr-preview/publish.
#
# Composite actions cannot declare triggers, permissions, or concurrency.
# The caller workflow must run on `pull_request_target` (types: opened,
# synchronize, reopened, closed) with `contents: read`, `id-token: write`,
# `pull-requests: write`, and a per-PR concurrency group.
#
# Caller contract - the trust boundary now lives in the caller workflow:
#   - This step MUST run before any step that checks out or executes PR code.
#   - EVERY later step that touches PR code (checkout, build, push, publish)
#     MUST carry `if: steps.<gate-id>.outputs.member == 'true'`.
#   - Check out `github.event.pull_request.head.sha` (not the default base
#     ref) with `persist-credentials: false`.
#   - Tag every preview image with `image-tag`, verbatim.
# See ../README.md.

name: 'PR Preview - Gate'
description: 'Withdraw the preview signal and decide whether this PR may have a preview'

inputs:
  app-id:
    description: 'GitHub App ID used to check org membership'
    required: true
  private-key:
    description: 'Private key of that GitHub App'
    required: true
  approval-label:
    description: >-
      Optional. Name of a label an org member can apply to a same-repo PR to
      approve one preview build of its current head, even when the PR author
      is not an org member (e.g. a GitHub App bot). The label is removed on
      every run, so each new head commit needs a fresh approval. The caller
      must add `labeled` to its `pull_request_target` types and filter
      `labeled` events down to this label. Empty (the default) disables it.
    required: false
    default: ''

outputs:
  member:
    description: >-
      'true' when the event is not `closed` and either the PR author, the
      actor who triggered this run, and the head repository owner are all org
      members, or an org member applied `approval-label` to a same-repo PR.
      Anything else (including a `closed` event) is 'false'.
    value: ${{ steps.check.outputs.member == 'true' }}
  image-tag:
    description: >-
      Tag every preview image must carry: pr-<number>-<head-sha>. Must match
      what the ApplicationSet renders as pr-{{ .number }}-{{ .head_sha }}.
    value: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    # Withdraw the signal first, on every event. The ApplicationSet derives
    # {{ .head_sha }} from the live PR, so on `synchronize` a label left over
    # from the previous build would let it deploy pr-<number>-<new-sha> before
    # that image is pushed - and point at a nonexistent tag for as long as
    # that commit stays the head if the build fails. Removing the label up
    # front makes the signal fail closed: it is absent whenever the image it
    # implies might not exist, at the cost of the preview going dark while a
    # rebuild is in flight.
    # On `closed` this doubles as immediate teardown (redundant with the
    # generator - a closed PR leaves its result set anyway - but immediate).
    # -------------------------------------------------------------------------
    - name: Disable preview
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label preview || true

    # The approval label is one-shot: it approves the head SHA in the event
    # that applied it and nothing else. Clearing it on every run means a new
    # push (`synchronize`) is never built on the strength of an old approval.
    # This run still sees the label in its own event payload.
    - name: Consume preview approval
      if: inputs.approval-label != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        APPROVAL_LABEL: ${{ inputs.approval-label }}
      run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label "$APPROVAL_LABEL" || true

    - name: Comment teardown
      if: github.event.action == 'closed'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: >-
        gh pr comment "${{ github.event.pull_request.number }}"
        --body 'PR Preview: torn down'

    # -------------------------------------------------------------------------
    # Gate: every identity that could have supplied the head commit must be an
    # org member, not just the PR opener:
    #   - AUTHOR: who opened the PR. Not enough on its own - a member can open
    #     a PR from a fork someone else controls.
    #   - ACTOR: who triggered THIS run. On `synchronize` that is whoever
    #     pushed the new head, so an outsider pushing to a member's fork
    #     fails the gate even though the member opened the PR.
    #   - HEAD_OWNER: who owns the head repository. For same-repo PRs this is
    #     the org itself; for forks the fork owner must be a member, so an
    #     outsider-controlled fork is never built regardless of who opened it.
    # Maintainer approval (optional, `approval-label`): an org member labels a
    # same-repo PR whose author is not a member, typically an org-owned
    # GitHub App bot. This replaces the AUTHOR check only:
    #   - SENDER (= ACTOR on a `labeled` event) must be a member, so the
    #     approval comes from a person in the org, not the bot.
    #   - HEAD_OWNER must be the org: same-repo branches only, never forks.
    #   - The build is pinned to the head SHA in this event's payload, and the
    #     label is consumed above, so later pushes need a fresh approval.
    # GITHUB_TOKEN cannot read org membership, so this needs an App token.
    # Safe on fork PRs: no fork code has been checked out or run at this
    # point, so the App token is only ever handled by trusted steps.
    # -------------------------------------------------------------------------
    - id: app-token
      if: github.event.action != 'closed'
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}

    - id: check
      if: github.event.action != 'closed'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        ACTOR: ${{ github.actor }}
        HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        ORG: ${{ github.repository_owner }}
        APPROVAL_LABEL: ${{ inputs.approval-label }}
        EVENT_ACTION: ${{ github.event.action }}
        LABEL_NAME: ${{ github.event.label.name }}
        SENDER: ${{ github.event.sender.login }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # 204 = member (including private membership), 404 = not a member.
        is_member() {
          gh api "/orgs/${ORG}/members/$1" --silent 2>/dev/null
        }

        if [ -n "$APPROVAL_LABEL" ] && [ "$EVENT_ACTION" = "labeled" ] \
          && [ "$LABEL_NAME" = "$APPROVAL_LABEL" ]; then
          if [ "$HEAD_OWNER" = "$ORG" ] && is_member "$SENDER"; then
            echo "::notice::${SENDER} approved a preview of ${HEAD_SHA} - preview enabled"
            echo "member=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::${APPROVAL_LABEL} applied by ${SENDER} to a PR from ${HEAD_OWNER} - approval ignored"
        fi

        trusted=true
        for login in "$AUTHOR" "$ACTOR"; do
          if ! is_member "$login"; then
            echo "::notice::${login} is not a member of ${ORG} - preview skipped"
            trusted=false
          fi
        done

        # Same-repo PRs: head owner IS the org. Anything else must be a
        # member's personal fork.
        if [ "$HEAD_OWNER" != "$ORG" ] && ! is_member "$HEAD_OWNER"; then
          echo "::notice::head repo owner ${HEAD_OWNER} is not a member of ${ORG} - preview skipped"
          trusted=false
        fi

        echo "member=${trusted}" >> "$GITHUB_OUTPUT"
        if [ "$trusted" = "true" ]; then
          echo "::notice::author, actor, and head repo owner are all members of ${ORG} - preview enabled"
        fi
