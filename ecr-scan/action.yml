name: 'ECR image scan'
description: >-
  Installs ecr-scan, which scans a local container image with Amazon Inspector and reports the critical
  CVEs ECR enhanced scanning would report, with credentials that can scan but not push.

inputs:
  copilot:
    description: >-
      Set to 'true' in Copilot coding agent setup steps. The agent's session doesn't inherit this job's
      environment, so this installs ecr-scan in /usr/local/bin and saves the credentials to ~/.aws.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials via OIDC (scan-only role)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: "arn:aws:iam::746476062914:role/github-actions-inspector-scan"
        aws-region: "us-east-1"
        role-session-name: gha-ecr-scan-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Install ecr-scan
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        dir="${RUNNER_TEMP}/ecr-scan-bin"
        mkdir -p "$dir"
        cp "${ACTION_PATH}/ecr-scan" "$dir/ecr-scan"
        chmod +x "$dir/ecr-scan"
        "$dir/ecr-scan" --install "$dir"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Set up ecr-scan for the Copilot agent's session
      if: inputs.copilot == 'true'
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        sudo install -m 755 "${RUNNER_TEMP}/ecr-scan-bin/ecr-scan" "${RUNNER_TEMP}/ecr-scan-bin/inspector-sbomgen" /usr/local/bin/
        mkdir -p ~/.aws
        umask 077
        cat >~/.aws/credentials <<CREDS
        [default]
        aws_access_key_id = ${AWS_ACCESS_KEY_ID}
        aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
        aws_session_token = ${AWS_SESSION_TOKEN}
        CREDS
        printf '[default]\nregion = us-east-1\n' >~/.aws/config
        echo "ecr-scan is in /usr/local/bin; scan-only credentials are in ~/.aws for an hour."
